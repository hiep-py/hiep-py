<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Hồ Hiệp · LacDev">
  <style>
    .meta { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f5f2ec; letter-spacing: 2px; }
    .dim { fill-opacity: .55; }
    .big { font: 900 220px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; fill: #f5f2ec; fill-opacity: 0; stroke: #f5f2ec; stroke-width: 2;
            stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.4s .2s cubic-bezier(.6,0,.2,1) forwards, fill .8s 2.3s ease forwards; }
    .rule { stroke: #f5f2ec; stroke-width: 1; }
    .band { fill: #f5f2ec; }
    .tick { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #050505; letter-spacing: 3px; }
    .run { animation: run 28s linear infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill-opacity: 1; stroke-width: 0; } }
    @keyframes run { to { transform: translateX(-1500px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .big { animation: none; fill-opacity: 1; stroke-width: 0; } .run, .blink { animation: none; } }
  </style>
  <rect width="1200" height="380" fill="#050505"/>
  <text x="40" y="52" class="meta">HỒ HIỆP</text>
  <text x="600" y="52" class="meta dim" text-anchor="middle">DEVELOPER — VIETNAM</text>
  <text x="1160" y="52" class="meta" text-anchor="end">LACDEV.XYZ</text>
  <line x1="40" y1="72" x2="1160" y2="72" class="rule"/>
  <text x="34" y="272" class="big" textLength="1132" lengthAdjust="spacingAndGlyphs">LACDEV</text>
  <text x="40" y="306" class="meta dim" textLength="330" lengthAdjust="spacing">~/hiep $ build --clean --fast --stable</text>
  <rect x="378" y="294" width="10" height="16" class="band blink"/>
  <rect x="0" y="334" width="1200" height="46" class="band"/>
  <g class="run">
    <text x="0" y="362" class="tick" textLength="1500" lengthAdjust="spacing">AI INTEGRATION  /  AUTOMATION  /  SYSTEM DESIGN  /  PERFORMANCE  /  ANDROID  /  WEB  /  LINUX  /  </text>
    <text x="1500" y="362" class="tick" textLength="1500" lengthAdjust="spacing">AI INTEGRATION  /  AUTOMATION  /  SYSTEM DESIGN  /  PERFORMANCE  /  ANDROID  /  WEB  /  LINUX  /  </text>
  </g>
</svg>
